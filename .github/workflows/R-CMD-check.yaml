# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          # Avoid the macOS ARM runner capacity constraints.
          - {os: macos-15-intel, r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # What a current chart gives, checked against the library this package vendors:
  # the specs of its fixtures, its schema, and the tests that compile charts in
  # Chrome. Every prerequisite must be there: GENEVIEWER_REQUIRE_TESTS makes a
  # missing one a failure, where it is a skip in the job above and for users.
  # The library's checkout is the tag of the vendored version, so it needs a
  # release: vendor one (dev/update_js.R <version>), not a development build.
  contract:
    runs-on: ubuntu-latest

    name: contract with the vendored geneviewer-js

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      LC_ALL: C.UTF-8
      GENEVIEWER_REQUIRE_TESTS: true
      GENEVIEWER_JS_DIR: ${{ github.workspace }}/geneviewer-js
      GENEVIEWER_SPEC_SCHEMA: ${{ github.workspace }}/geneviewer-js/schema/spec-v1.schema.json

    steps:
      - uses: actions/checkout@v4

      - name: Read the vendored version
        id: vendored
        run: |
          version=$(ls inst/htmlwidgets/lib | sed -n 's/^geneviewer-//p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: nvelden/geneviewer-js
          ref: v${{ steps.vendored.outputs.version }}
          path: geneviewer-js

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::jsonvalidate, any::knitr
          needs: check

      - name: Run the tests
        run: Rscript -e 'testthat::test_local(reporter = "check", stop_on_failure = TRUE)'
