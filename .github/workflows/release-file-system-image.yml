on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload assets to
        required: true
        type: string

name: Build and deploy wasm R package image

jobs:
  release-file-system-image:
    runs-on: ubuntu-22.04
    container: ghcr.io/r-wasm/webr:v0.6.0
    permissions:
      contents: write
    concurrency:
      group: wasm-release-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The image provides the wasm toolchain; this build does not render vignettes.
      PKG_SYSREQS: "false"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build wasm image
        shell: Rscript --vanilla {0}
        run: |
          # Pin rwasm and the resolver workaround for:
          # https://github.com/r-lib/pkgdepends/issues/462
          # Installing rwasm alone can replace the image's patched resolver.
          pak::pak(c(
            "r-wasm/rwasm@5195adb0da3703d624c5e5cf98cd10bb0d3d2263",
            "r-lib/pkgdepends@fa3730e67dc3efe72949740079d50188b2ef79aa"
          ))
          rwasm::add_pkg(".", repo_dir = "_site", compress = FALSE)
          rwasm::make_vfs_library(
            out_dir = "._rwasm", repo_dir = "_site", compress = FALSE
          )
          stopifnot(all(file.exists(file.path(
            "._rwasm", c("library.data", "library.js.metadata")
          ))))

      - name: Upload wasm image to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "._rwasm/*"
          tag: ${{ env.RELEASE_TAG }}
          file_glob: true
          overwrite: true
